<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 495 195" width="495" height="195">
  <style>
    .dark { fill: #1a1a2e; }
    .grid { fill: #0d1117; stroke: #161b22; stroke-width: 1; }
    .col { fill: #216e4e; }
    .col-2 { fill: #30a14e; }
    .col-3 { fill: #84b86b; }
    .snake-body { fill: none; stroke: #00d4ff; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
    .snake-head { fill: #ff00c8; }
    .snake-eye { fill: #000; }
    .snake-eye2 { fill: #fff; }
    .food { fill: #f85149; }
  </style>
  <defs>
    <clipPath id="outer_rectangle">
      <rect width="495" height="195" rx="4.5"/>
    </clipPath>
  </defs>
  <g clip-path="url(#outer_rectangle)">
    <rect class="dark" width="495" height="195" rx="4.5"/>
    <g class="grid">
      <!-- Grille de contribution -->
      <g stroke="#161b22">
        <line x1="75" y1="20" x2="75" y2="170"/>
        <line x1="145" y1="20" x2="145" y2="170"/>
        <line x1="215" y1="20" x2="215" y2="170"/>
        <line x1="285" y1="20" x2="285" y2="170"/>
        <line x1="355" y1="20" x2="355" y2="170"/>
        <line x1="425" y1="20" x2="425" y2="170"/>
      </g>
      <g stroke="#161b22">
        <line x1="0" y1="30" x2="495" y2="30"/>
        <line x1="0" y1="55" x2="495" y2="55"/>
        <line x1="0" y1="80" x2="495" y2="80"/>
        <line x1="0" y1="105" x2="495" y2="105"/>
        <line x1="0" y1="130" x2="495" y2="130"/>
        <line x1="0" y1="155" x2="495" y2="155"/>
      </g>
      <!-- Quelques carrés de contribution colorés -->
      <rect x="75" y="30" width="15" height="15" class="col"/>
      <rect x="75" y="55" width="15" height="15" class="col-2"/>
      <rect x="145" y="80" width="15" height="15" class="col"/>
      <rect x="215" y="55" width="15" height="15" class="col-3"/>
      <rect x="215" y="105" width="15" height="15" class="col"/>
      <rect x="285" y="30" width="15" height="15" class="col-2"/>
      <rect x="285" y="130" width="15" height="15" class="col"/>
      <rect x="355" y="80" width="15" height="15" class="col-3"/>
      <rect x="355" y="155" width="15" height="15" class="col"/>
      <rect x="425" y="55" width="15" height="15" class="col-2"/>
      <rect x="425" y="105" width="15" height="15" class="col"/>
    </g>
    <!-- Snake -->
    <path class="snake-body" d="M425,62 C425,62 405,62 405,62 C405,62 405,80 405,80 C405,80 385,80 385,80 C385,80 385,100 385,100 C385,100 365,100 365,100 C365,100 365,120 365,120 C365,120 345,120 345,120"/>
    <circle cx="345" cy="123" r="8" class="snake-head"/>
    <circle cx="340" cy="123" r="3" class="snake-eye"/>
    <circle cx="350" cy="123" r="1.5" class="snake-eye2"/>
    <circle cx="145" cy="85" r="5" class="food"/>
    <circle cx="285" cy="35" r="5" class="food"/>
    <circle cx="355" cy="85" r="5" class="food"/>
  </g>
</svg>
