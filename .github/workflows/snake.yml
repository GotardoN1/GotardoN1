name: Snake

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  snake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # a credencial precisa ficar disponível para o git push no fim
      - uses: actions/checkout@v4
      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: GotardoN1
          outputs: |
            ./output/github-snake.svg
            ./output/github-snake-dark.svg?palette=github-dark
      - name: Commit snake
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ./output
          git commit -m "chore: update snake animation" || echo "Nothing to update"
          git push
